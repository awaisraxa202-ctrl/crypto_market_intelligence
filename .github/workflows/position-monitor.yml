name: Position Monitor (frequent, lightweight)

# This does NOT run on GitHub's own cron — scheduled Actions on low-traffic repos
# get delayed by hours (this is a GitHub platform limitation, not something a
# workflow file can fix). Instead this listens for workflow_dispatch, which an
# external free scheduler (cron-job.org) calls every 10-15 minutes via the
# GitHub API. See README.md "Free frequent monitoring" for setup.
#
# This job only checks existing open positions against the live price for
# stop-loss / take-profit — it does NOT run the full 9-asset indicator pipeline,
# so it's fast (seconds) and cheap (well inside GitHub's free Actions minutes).

on:
  workflow_dispatch:

# Both this and the other workflow write docs/paper_account.json and push to
# main. Without a shared concurrency group they can run simultaneously and one
# will clobber or fail to push over the other. Same group name in both files
# means GitHub queues them instead of racing.
concurrency:
  group: market-cortex-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: pip install pandas numpy requests

      - name: Check open positions only
        run: python crypto_market_intelligence_v60.py --check-positions-only

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A (all) plus explicit paths, and don't fail if a path doesn't exist yet
          for f in docs/paper_account.json docs/signal_database.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "Position check $(date -u +%H:%M)"
          # The main 2-hour pipeline also pushes to main; pull-rebase avoids a
          # rejected push if both happen to run close together. That handles a
          # real non-fast-forward conflict, but not a transient GitHub-side
          # error on an already-up-to-date branch (seen twice on 2026-09-13,
          # 16 minutes apart: "remote: Internal Server Error" with no real
          # conflict at all) — retry with backoff before failing the whole
          # job over something a second attempt fixes on its own.
          #
          # A genuine rebase CONFLICT is different from a transient push
          # rejection, and the plain retry above never handled it — see
          # update.yml's history 2026-09-20 17:00-17:11 UTC for the same bug
          # in the sibling workflow. Both files this job writes are fully
          # regenerated each run, so on conflict just abort the rebase, reset
          # onto the new tip, and recommit this run's data on top of it.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed (rebase succeeded, push rejected)."
            else
              echo "Rebase conflict on attempt $attempt — keeping this run's freshly computed data."
              git rebase --abort
              git fetch origin main
              git reset --soft origin/main
              for f in docs/paper_account.json docs/signal_database.json; do
                [ -f "$f" ] && git add "$f"
              done
              git commit -m "Position check $(date -u +%H:%M)"
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed (after conflict resolution)."
            fi
            [ "$attempt" -lt 5 ] && sleep $((attempt * 5))
          done
          echo "::error::git push failed after 5 attempts"
          exit 1