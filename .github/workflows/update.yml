name: Market Cortex Hourly Update

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with position-monitor.yml — both write docs/paper_account.json and push
# to main, so they must queue rather than run simultaneously and clobber each
# other. (This also still serialises the Pages deploy, which is what the old
# "pages" group did.)
concurrency:
  group: market-cortex-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pandas numpy requests yfinance websockets scipy
      - name: Run Market Cortex v6.0 Ultimate Engine
        run: python crypto_market_intelligence_v60.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BEACONCHAIN_API_KEY: ${{ secrets.BEACONCHAIN_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # paper_account.json was missing here — the full pipeline advances the
          # account (new entries, DCA, exits) but those changes were never
          # committed by this workflow, so they were silently discarded each run.
          for f in docs/market_intelligence.json docs/signal_history.json docs/signal_database.json docs/v6_results.json docs/market_summary.txt docs/paper_account.json; do
            [ -f "$f" ] && git add "$f"
          done
          # position-monitor.yml has always rebased before pushing for this exact
          # reason; this workflow never did. Confirmed on 2026-09-10: a scheduled
          # run's 5-minute engine pass completed fine, then its plain `git push`
          # was rejected as non-fast-forward against a push that landed on main
          # while it was running — the whole cycle's freshly computed data was
          # silently dropped, not just delayed. The shared concurrency group only
          # serializes GitHub Actions runs against each other; it does nothing
          # for a push made outside Actions (a maintainer, a hotfix, this exact
          # session). Same fix as the other workflow: rebase immediately before
          # the push, right after committing, so a moved main is reconciled
          # instead of silently losing the run's output.
          git diff --cached --quiet || (git commit -m "Hourly update [$(date -u +%Y-%m-%d_%H-%M)]" && git pull --rebase origin main && git push)

  deploy:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4